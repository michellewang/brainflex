[build-system]
build-backend = "hatchling.build"
requires = ["hatch-vcs", "hatchling"]

[project]
authors = [{ name = "Michelle Wang" }]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "nipoppy==0.4.7",
    "obstore>=0.9,<0.10",
    "rich",
    "typer>=0.13",
]
description = "Brain federated learning experiment"
license = { file = "LICENSE" }
name = "brainflex"
readme = "README.md"
requires-python = ">=3.11, <3.16"
dynamic = ["version"]

[dependency-groups]
dev = [{ include-group = "doc" }, { include-group = "test" }, "prek"]
doc = [
    "furo",
    "myst-parser>=5.1.0", # for the "alert" extension
    "sphinx",
    "sphinx-copybutton",
]
test = [
    "pytest-cov",
    "pytest-mock",
    "pytest>=6.0.0",
]

[project.scripts]
brainflex = "brainflex.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/brainflex"]

[tool.hatch.build.hooks.vcs]
version-file = "src/brainflex/_version.py"

[tool.hatch.version]
source = "vcs"

[tool.codespell]
skip = '.git,.github,pyproject.toml,uv.lock'

[tool.pytest.ini_options]
addopts = "--color=yes -ra -q -vv"
testpaths = ["tests/"]
minversion = "6.0"
xfail_strict = true
