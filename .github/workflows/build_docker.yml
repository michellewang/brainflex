name: Build Docker images

on:
  push:
    tags: ["docker/v*"]
  pull_request:
    paths: ["docker/**", ".github/workflows/build_docker.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, to check that the tag is on main
          persist-credentials: false
      # only publish images for tags on commits that are on main
      - name: Check that tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi
      # use the docker driver so that the vpn-client image built in the first
      # step is visible to `FROM vpn-client` in the vpn-server Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-client
        with:
          images: ghcr.io/neurodatascience/brainflex-vpn-client
          tags: |
            type=match,pattern=docker/v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/docker/v') }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-server
        with:
          images: ghcr.io/neurodatascience/brainflex-vpn-server
          tags: |
            type=match,pattern=docker/v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/docker/v') }}
      - name: Build vpn-client
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/vpn-client
          tags: |
            vpn-client
            ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          load: true
          push: false
      - name: Push vpn-client
        if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.meta-client.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker push "$tag"
          done
      - name: Build (and push) vpn-server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/vpn-server
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          push: ${{ github.event_name == 'push' }}
